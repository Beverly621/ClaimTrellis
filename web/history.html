<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf3f6" />
    <title>Audit history — ClaimTrellis</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/brand/mark.png" />
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="history-page">
    <a class="skip-link" href="#history-main">Skip to history</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="ClaimTrellis home"><img class="brand-lockup" src="/assets/brand/lockup.png" width="923" height="244" alt="ClaimTrellis" /></a>
      <div class="header-tools">
        <a href="/projects">Paper Workflow</a>
        <div class="theme-switch" role="group" aria-label="Color theme">
          <button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="true">☀</button>
          <button type="button" data-theme-choice="night" aria-label="Night theme" aria-pressed="false">☾</button>
        </div>
        <a class="nav-cta" href="/#workspace">Open console <span>↗</span></a>
      </div>
    </header>
    <main id="history-main" class="shell history-main">
      <p class="micro accent" id="history-kind">YOUR RESEARCH LOG</p>
      <h1>Audit history<span class="accent">.</span></h1>
      <p class="history-intro">Guest audits stay with this browser's anonymous session. Linking an account keeps access across devices.</p>
      <p id="history-status" role="status" aria-live="polite">Preparing your workspace…</p>
      <div id="history-list" aria-live="polite"></div>
      <button id="history-more" class="button secondary" type="button" hidden>Load more →</button>
      <p><a class="text-link" href="/#workspace">← Back to console</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous" defer></script>
    <script src="/assets/auth.js" defer></script>
    <script src="/assets/history.js" defer></script>
  </body>
</html>
